<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-es="Pedir presupuesto · Tienda Pinger · Marexi">Request a quote · Pinger store · Marexi</title>
<meta name="description" content="Pinger store: buy Pinger® V2.3 acoustic deterrent devices for dolphins and other cetaceans in packs of 3, 5 or 10 units, or request a fleet quote." data-es-content="Tienda Pinger: compre dispositivos acústicos de disuasión Pinger® V2.3 para delfines y otros cetáceos en packs de 3, 5 o 10 unidades, o pida presupuesto de flota.">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/shop/shop.css">
</head>
<body data-page="quote">
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/" title="Marexi"><img src="/logo_marexi_light.png" alt="Marexi Marine Technology"></a>
    <a class="storehome" href="/shop/" data-es="Catálogo">Store home</a>
    <nav class="catmenu" aria-label="Catalogue sections">
      <a href="/shop/#units" data-es="Unidades">Units</a>
      <a href="/shop/#fleet" data-es="Flota">Fleet</a>
    </nav>
    <div class="nav-right">
      <a class="cartlink" href="/shop/cart/"><span data-es="Carrito">Cart</span> <span class="badge" id="cartBadge" style="display:none">0</span></a>
      <div class="lang" role="group" aria-label="Language">
        <button id="btn-en" class="on" onclick="setLang('en')">EN</button>
        <button id="btn-es" onclick="setLang('es')">ES</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <h1 class="sec-title" style="margin-top:34px" data-es="Pedir presupuesto / piloto">Request a quote / pilot</h1>
  <p class="sec-sub" id="qProduct"></p>
  <div class="card">
    <form id="qForm" novalidate><input type="hidden" id="psku" value="">
      <fieldset class="fs"><legend data-es="Qué necesita">What you need</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="reqtype" value="Quote" checked><span data-es="Presupuesto">Quote</span></label>
          <label class="choice"><input type="radio" name="reqtype" value="Pilot deployment"><span data-es="Despliegue piloto">Pilot deployment</span></label>
          <label class="choice"><input type="radio" name="reqtype" value="Technical briefing"><span data-es="Briefing técnico">Technical briefing</span></label>
        </div>
      </fieldset>
      <fieldset class="fs"><legend data-es="Contacto">Contact</legend>
        <div class="grid2">
          <div class="field"><label class="k" for="name" data-es="Nombre &lt;span class='req'&gt;*&lt;/span&gt;">Full name <span class="req">*</span></label><input class="inp" id="name" autocomplete="name"></div>
          <div class="field"><label class="k" for="company" data-es="Empresa &lt;span class='req'&gt;*&lt;/span&gt;">Company <span class="req">*</span></label><input class="inp" id="company" autocomplete="organization"></div>
          <div class="field"><label class="k" for="role" data-es="Cargo">Role</label><input class="inp" id="role" autocomplete="organization-title"></div>
          <div class="field"><label class="k" for="email" data-es="Correo &lt;span class='req'&gt;*&lt;/span&gt;">Email <span class="req">*</span></label><input class="inp" id="email" type="email" autocomplete="email" placeholder="you@company.com"></div>
          <div class="field"><label class="k" for="phone" data-es="Teléfono">Phone</label><input class="inp" id="phone" type="tel" autocomplete="tel" placeholder="+34 …"></div>
          <div class="field"><label class="k" for="country" data-es="País &lt;span class='req'&gt;*&lt;/span&gt;">Country <span class="req">*</span></label><input class="inp" id="country" autocomplete="country-name"></div>
        </div>
      </fieldset>
      <fieldset class="fs"><legend data-es="Su operación">Your operation</legend>
        <div class="grid2">
          <div class="field"><label class="k" for="sector" data-es="Sector &lt;span class='req'&gt;*&lt;/span&gt;">Sector <span class="req">*</span></label>
            <select class="inp" id="sector">
              <option value="" data-es="Seleccione…">Select…</option>
              <option data-es="Acuicultura">Aquaculture</option>
              <option data-es="Pesca">Fishing</option>
              <option data-es="Eólica marina / construcción marina">Offshore wind / marine construction</option>
              <option data-es="Puertos y dársenas">Ports &amp; harbours</option>
              <option data-es="Ciencia e investigación">Science &amp; research</option>
              <option data-es="Defensa">Defence</option>
              <option data-es="Náutica recreativa">Recreational boating</option>
              <option data-es="Otro">Other</option>
            </select></div>
          <div class="field"><label class="k" for="scale" data-es="Escala (embarcaciones / dispositivos)">Scale (vessels / devices)</label><input class="inp" id="scale" placeholder="e.g. 8 vessels" data-es-ph="p. ej. 8 embarcaciones"></div>
          <div class="field full"><label class="k" for="area" data-es="Especies objetivo / zona">Target species / area</label><input class="inp" id="area" placeholder="e.g. orcas – Strait of Gibraltar" data-es-ph="p. ej. orcas – Estrecho de Gibraltar"></div>
          <div class="field"><label class="k" for="timeline" data-es="Plazo">Timeline</label>
            <select class="inp" id="timeline">
              <option value="" data-es="Seleccione…">Select…</option>
              <option data-es="Inmediato">Immediate</option>
              <option data-es="Esta temporada">This season</option>
              <option data-es="3–6 meses">3–6 months</option>
              <option data-es="Exploratorio">Exploratory</option>
            </select></div>
          <div class="field full"><label class="k" for="message" data-es="Mensaje">Message</label><textarea class="inp" id="message"></textarea></div>
        </div>
      </fieldset>
      <label class="consent"><input type="checkbox" id="consent">
        <span data-es="Autorizo a Marexi a almacenar y usar estos datos para responder a mi solicitud. &lt;span class='req'&gt;*&lt;/span&gt;">I consent to Marexi storing and using these details to respond to my request. <span class="req">*</span></span></label>
      <div class="actions" style="margin-top:20px">
        <button type="submit" class="btn" data-es="Enviar solicitud">Send request</button>
        <a class="btn ghost" href="/shop/" data-es="← Catálogo">← Catalogue</a>
      </div>
      <div class="err" id="err" role="alert"></div>
      <p class="small" data-es="Al enviar se abrirá su programa de correo con la solicitud ya redactada para &lt;b&gt;info@marexi.com&lt;/b&gt;.">When you send, your email program will open with the request already written to <b>info@marexi.com</b>.</p>
    </form>
  </div>
</main>
<footer>
  <div class="foot-inner">
    <div>© 2026 Marexi · Tecnología Marina Ximo, S.L.</div>
    <div class="foot-legal">
      <a href="/pinger/">Pinger®</a>
      <a href="/legal.html" data-es="Aviso Legal">Legal Notice</a>
      <a href="/legal.html#privacy" data-es="Privacidad">Privacy Policy</a>
    </div>
  </div>
</footer>
<script src="/shop/shop.js"></script>
</body>
</html>
