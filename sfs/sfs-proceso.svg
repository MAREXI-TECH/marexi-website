<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 92 560 230" role="img" aria-label="Peeling process in four steps">
  <!-- Opción 2: proceso en 4 pasos con iconos -->
  <rect y="92" width="560" height="230" rx="18" fill="#0c2236"/><rect x=".5" y="92.5" width="559" height="229" rx="18" fill="none" stroke="#1e415f"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#1e415f" stroke-width="2"><circle cx="85" cy="170" r="52"/><circle cx="215" cy="170" r="52"/><circle cx="345" cy="170" r="52"/><circle cx="475" cy="170" r="52"/></g>
    <g fill="none" stroke="#37c6c9" stroke-width="2" stroke-dasharray="4 6"><path d="M140 170 H160"/><path d="M270 170 H290"/><path d="M400 170 H420"/></g>
    <!-- 1 sujeción -->
    <g fill="none" stroke="#cfe6f7" stroke-width="2.4" stroke-linejoin="round">
      <rect x="54" y="158" width="10" height="24" rx="2"/><rect x="106" y="158" width="10" height="24" rx="2"/>
      <path d="M64 170 C 76 160, 94 160, 106 170 C 94 180, 76 180, 64 170 Z"/>
      <path d="M85 146 a14 14 0 1 1 -12 7" /><path d="M73 153 l-2 -8 l8 2" />
    </g>
    <!-- 2 escaneo láser -->
    <g fill="none" stroke-width="2.4"><path d="M190 180 C 202 170, 228 170, 240 180 C 228 190, 202 190, 190 180 Z" stroke="#cfe6f7"/>
      <rect x="205" y="138" width="20" height="10" rx="2" stroke="#37c6c9"/><path d="M215 148 L195 178 M215 148 L235 178" stroke="#37c6c9" stroke-dasharray="4 3"/></g>
    <!-- 3 pelado ultrasónico -->
    <g fill="none" stroke-width="2.4"><path d="M320 185 C 332 175, 358 175, 370 185 C 358 195, 332 195, 320 185 Z" stroke="#cfe6f7"/>
      <path d="M338 142 v22 l8 8 l8 -8 v-22 z" stroke="#cfe6f7"/>
      <path d="M362 150 a8 8 0 0 1 0 12 M368 146 a14 14 0 0 1 0 20" stroke="#37c6c9"/></g>
    <!-- 4 tiras cortadas y marcadas -->
    <g fill="none" stroke-width="2.4" stroke="#cfe6f7"><rect x="450" y="150" width="50" height="10" rx="2"/><rect x="450" y="166" width="50" height="10" rx="2"/><rect x="450" y="182" width="50" height="10" rx="2"/></g>
    <g fill="#37c6c9"><rect x="456" y="153" width="8" height="4"/><rect x="456" y="169" width="8" height="4"/><rect x="456" y="185" width="8" height="4"/></g>
    <g fill="#ff6a4d" font-size="13" font-weight="800"><text x="85" y="252">01</text><text x="215" y="252">02</text><text x="345" y="252">03</text><text x="475" y="252">04</text></g>
    <g fill="#eef4fb" font-size="15" font-weight="600"><text x="85" y="276">Sujeción</text><text x="215" y="276">Escaneo láser</text><text x="345" y="276">Pelado</text><text x="475" y="276">Corte y marcado</text></g>
    <g fill="#9fb4cc" font-size="12"><text x="85" y="294">Clamping</text><text x="215" y="294">Laser scan</text><text x="345" y="294">Ultrasonic peeling</text><text x="475" y="294">Cut and marking</text></g>
  </g>
</svg>
