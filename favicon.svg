<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Marexi</title>

  <!-- background squircle -->
  <rect width="64" height="64" rx="14" fill="#081627"/>

  <!-- outer glow ring — orange -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ff6a4d" stroke-width="2.2" opacity=".55"/>

  <!-- mid ring — cyan -->
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#37c6c9" stroke-width="2.2" opacity=".85"/>

  <!-- inner ring — cyan faint -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="#37c6c9" stroke-width="1.2" opacity=".35"/>

  <!-- center dot — cyan solid -->
  <circle cx="32" cy="32" r="4.5" fill="#37c6c9"/>

  <!-- sonar sweep line — subtle orange, top-right quadrant -->
  <line x1="32" y1="32" x2="50" y2="14" stroke="#ff6a4d" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
</svg>
